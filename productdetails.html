<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">


<!-- This page serves as a dynamic template that displays specific product information based on data passed through the URL.
 Instead of creating a separate HTML file for every item, 
 this single file updates its content automatically using JavaScript. the Idea to use javascript was taken from OpenAI. -->
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">Kay Beauty</a>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-right">
      <input type="text" placeholder="Search..." class="search-bar">
      <span class="cart">🛒</span>
    </div>
  </nav>
  <section class="product-details">

    <div class="product-layout">

      <div class="product-image">
        <img id="product-img" src="" alt="Product image">
      </div>

      <div class="product-info">
        <h1 id="product-title"></h1>
        <p id="product-desc"></p>
        <p class="price" id="product-price"></p>
        <button class="btn cart-btn">Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- This script provides the functionality for a dynamic product page.
   It allows a single HTML file to display various products 
   by retrieving data based on a unique identifier passed in the URL. -->




  <script>
    const products = {
      "lipstick-matte": {
        title: "Long-lasting Matte Lipstick",
        description: "Matte lipstick providing long-lasting color with a comfortable application.",
        price: "€24.99",
        image: "img/mattelipstick.jpg"
      },

      "lipstick-shine": {
        title: "Long-lasting Shine Lipstick",
        description: "Creamy lipstick offering consistent color payoff and smooth wear.",
        price: "€29.99",
        image: "img/creamlipstick.jpg"
      },

      "foundation-matte": {
        title: "Lightweight Matte Foundation",
        description: "Lightweight matte foundation designed to provide an even skin tone with a long-lasting natural finish.",
        price: "€49.99",
        image: "img/mattefoundation.jpg"
      },

      "foundation-glow": {
        title: "Lightweight Glow Foundation",
        description: "Buildable foundation offering lightweight coverage while maintaining comfort throughout the day.",
        price: "€54.99",
        image: "img/glowfoundation.jpg"
      },

      "eyeshadow-nude": {
        title: "Nude Shimmer Eyeshadow Palette",
        description: "Soft nude shimmery eyeshadow palette for natural glam looks.",
        price: "€35.99",
        image: "img/nudeeyeshadow.jpg"
      },

      "eyeshadow-soft-glam": {
        title: "Soft Glam Eyeshadow Palette",
        description: "Blendable eyeshadow shades suitable for everyday makeup looks.",
        price: "€39.99",
        image: "img/softglameyeshadow.jpg"
      },

      "blush-powder": {
        title: "Powder Blush Palette",
        description: "Smooth-textured blush that enhances facial features with a balanced finish.",
        price: "€37.99",
        image: "img/powderblush.jpg"
      },

      "blush-creme": {
        title: "Creme Blush Palette",
        description: "Silky blush formulated to add a natural-looking flush to the cheeks.",
        price: "€60.99",
        image: "img/cremeblush.jpg"

        
      }
    };

    //<!-- Retrieve the product identifier from the URL parameters -->
    //It uses URLSearchParams, a built-in JavaScript feature that reads the query string — the part of the URL that comes after the ?.
    //The script specifically looks for the value linked to the product parameter (?product=).

    
    const params = new URLSearchParams(window.location.search);
    const key = params.get("product");

    if (products[key]) {
      document.getElementById("product-title").textContent = products[key].title;
      document.getElementById("product-desc").textContent = products[key].description;
      document.getElementById("product-price").textContent = products[key].price;
      document.getElementById("product-img").src = products[key].image;
    }
  </script>
</body>
</html>
